name: Temporary dependency audit fix

on:
  push:
    branches:
      - fix/dependency-audit-20260903

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dependency-audit-20260903
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Refresh vulnerable lock entries only
        run: npm audit fix --package-lock-only
      - name: Clean install
        run: npm ci
      - name: Security gates
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Full tests
        run: npm test
      - name: Full typecheck
        run: npm run typecheck
      - name: Full build
        run: npm run build
      - name: Compiled acceptance
        run: npm run acceptance:compiled
      - name: Commit lockfile repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          git commit -m 'fix: refresh vulnerable dependency lock entries'
          git push origin HEAD:fix/dependency-audit-20260903
