name: Catalog roundtrip CI

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-roundtrip-ci.yml"
      - "compute/**"
      - "compute-contracts/**"
      - "frontend/**"
      - "deployment/nginx/**"
      - "deployment/systemd/academiccloud-catalog-bridge.service"
      - "scripts/local-compute/*catalog-bridge*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-roundtrip-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend / Compute / catalog bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Install clean dependency tree
        run: npm ci

      - name: Verify shared Compute contracts
        run: |
          npm run typecheck --workspace @academiccloud/compute-contracts
          npm test --workspace @academiccloud/compute-contracts
          npm run build --workspace @academiccloud/compute-contracts

      - name: Verify Compute source and catalog export/bridge tests
        run: |
          npm run typecheck --workspace @academiccloud/compute
          npm run build --workspace @academiccloud/compute
          npx --no-install tsx --test \
            compute/test/catalog-batch-export.test.ts \
            compute/test/catalog-bridge.test.ts

      - name: Verify frontend source and tests
        run: |
          npm run typecheck --workspace @academiccloud/frontend
          npm test --workspace @academiccloud/frontend
          npm run build --workspace @academiccloud/frontend

      - name: Verify catalog deployment script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/local-compute/assemble-catalog-bridge-release.sh
          bash -n scripts/local-compute/verify-catalog-bridge-release.sh
          bash -n scripts/local-compute/activate-catalog-bridge-release.sh
          command -v pwsh >/dev/null
          pwsh -NoProfile -NonInteractive -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/local-compute/install-catalog-bridge-autostart.ps1", [ref]$null, [ref]$errors); if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
