name: Temporary catalog filename strategy fix

on:
  push:
    branches:
      - fix/catalog-filename-strategies

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-filename-strategies
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scoped patch
        run: python3 scripts/tmp_catalog_filename_patch.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Backend tests
        run: npm run test --workspace @academiccloud/backend
      - name: Build
        run: npm run build
      - name: Commit scoped fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/catalog-batch/catalog-batch-service.ts backend/test/catalog-batch/filename-policy.test.ts backend/test/catalog-batch/catalog-batch-service.test.ts
          git diff --cached --check
          git commit -m 'fix: wire catalog filename strategies'
          git push origin HEAD:fix/catalog-filename-strategies
