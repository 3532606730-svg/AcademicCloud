# Replace cloud.example.edu and academiccloud-private.oss-ap-southeast-3.aliyuncs.com.
# Install the rendered file under /etc/nginx/sites-available, install the adjacent
# header snippet under /etc/nginx/snippets, and validate with nginx -t.

# Intentionally excludes URI, query, Referer, Cookie and Authorization data.
log_format academiccloud_safe '$remote_addr method=$request_method status=$status bytes=$body_bytes_sent duration=$request_time';

# Reject unknown clear-text hostnames rather than reflecting their Host header.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/academiccloud/nginx-access.log academiccloud_safe;
    error_log /var/log/academiccloud/nginx-error.log warn;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name cloud.example.edu;
    server_tokens off;
    access_log /var/log/academiccloud/nginx-access.log academiccloud_safe;
    error_log /var/log/academiccloud/nginx-error.log warn;
    return 301 https://cloud.example.edu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.example.edu;
    access_log /var/log/academiccloud/nginx-access.log academiccloud_safe;
    error_log /var/log/academiccloud/nginx-error.log warn;

    ssl_certificate /etc/letsencrypt/live/cloud.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AcademicCloudTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/academiccloud/current/frontend/dist;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    include /etc/nginx/snippets/academiccloud-security-headers.conf;

    location = /index.html {
        include /etc/nginx/snippets/academiccloud-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        # Keep prior content-hashed chunks reachable for open browser tabs.
        root /opt/academiccloud/public-assets;
        # Preserve standard asset MIME types and serve PDF.js module workers.
        include /etc/nginx/mime.types;
        types { application/javascript mjs; }
        include /etc/nginx/snippets/academiccloud-security-headers.conf;
        # Content-hashed public assets can be compressed independently of
        # authenticated API responses. nginx otherwise only gzips HTML.
        gzip on;
        gzip_types application/javascript text/javascript text/css;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /api {
        include /etc/nginx/snippets/academiccloud-security-headers.conf;
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # Capability-authenticated Compute callbacks are bounded independently of
    # ordinary browser JSON. The 512 KiB ceiling matches Core's strict result
    # parser; requests still traverse the same loopback-only API process.
    location ^~ /api/internal/compute/jobs/ {
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_request_buffering on;
    }

    # A bounded 500-resource selection can exceed the ordinary 16 KiB limit.
    # Match Core's export-request ceiling without widening other API routes.
    location ~ "^/api/libraries/[A-Za-z0-9_-]{1,128}/catalog-batches/export-request$" {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 130s;
        proxy_next_upstream off;
        proxy_request_buffering on;
    }

    # Catalog result documents are bounded independently of ordinary browser
    # JSON. Core independently enforces the same 8 MiB maximum.
    location ~ "^/api/libraries/[A-Za-z0-9_-]{1,128}/catalog-batches/preview$" {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 130s;
        proxy_next_upstream off;
        proxy_request_buffering on;
    }

    # Apply references a validated plan; 500 bounded selections fit in 256 KiB.
    location ~ "^/api/libraries/[A-Za-z0-9_-]{1,128}/catalog-batches/apply$" {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 130s;
        proxy_next_upstream off;
        proxy_request_buffering on;
    }

    # Current-page PNG plus base64 JSON. Core independently caps decoded bytes
    # at 2 MiB. Stream this transport to Core rather than nginx body-temp files.
    location = /api/reader/local-ocr/requests {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_request_buffering off;
    }

    # Synthetic probe, bounded machine result or private correction only.
    # Device polling, pairing and unrelated endpoints retain the 16 KiB limit.
    location ~ "^/api/reader/local-ocr/(connect|device/complete|results/[A-Za-z0-9_-]{1,128})$" {
        client_max_body_size 200k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 130s;
        proxy_next_upstream off;
        proxy_request_buffering on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Reject unknown TLS hostnames with no application content.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log /var/log/academiccloud/nginx-access.log academiccloud_safe;
    error_log /var/log/academiccloud/nginx-error.log warn;
    ssl_reject_handshake on;
}
