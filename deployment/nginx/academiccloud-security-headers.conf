add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# files.ajtlab.top is the dedicated OSS custom browser domain for signed
# download/preview GET URLs. The native bucket origin remains required for
# browser upload authorization and as the storage fallback origin.
# The exact loopback catalog bridge is the sole non-HTTPS connect-src target;
# Chrome gates public-site loopback access behind Local Network Access consent.
# No wildcard localhost/LAN destination is admitted.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self' https://ajt-academiccloud-kl-8f3c.oss-ap-southeast-3.aliyuncs.com; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://ajt-academiccloud-kl-8f3c.oss-ap-southeast-3.aliyuncs.com https://files.ajtlab.top; connect-src 'self' https://ajt-academiccloud-kl-8f3c.oss-ap-southeast-3.aliyuncs.com http://127.0.0.1:43117; frame-src 'self' https://ajt-academiccloud-kl-8f3c.oss-ap-southeast-3.aliyuncs.com https://files.ajtlab.top" always;

# Enable only after HTTPS and renewal are proven. Do not add includeSubDomains
# without reviewing sibling hosts.
# add_header Strict-Transport-Security "max-age=31536000" always;
