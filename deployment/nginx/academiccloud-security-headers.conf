add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self' https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com; connect-src 'self' https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com; frame-src 'self' https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com" always;

# Enable only after HTTPS and renewal are proven. Do not add includeSubDomains
# without reviewing sibling hosts.
