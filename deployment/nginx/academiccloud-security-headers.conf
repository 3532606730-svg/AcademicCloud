add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# files.ajtlab.top is the planned dedicated OSS custom browser domain for
# signed download/preview GET URLs. img-src and frame-src are the only
# directives that must accept it (browser-native PDF/image/text preview).
# connect-src stays untouched: no cross-origin JavaScript reads are needed,
# and form-action stays pinned to the upload bucket. This template change is
# NOT active in production until the files.ajtlab.top infrastructure gate.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self' https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com https://files.ajtlab.top; connect-src 'self' https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com; frame-src 'self' https://academiccloud-private.oss-ap-southeast-3.aliyuncs.com https://files.ajtlab.top" always;

# Enable only after HTTPS and renewal are proven. Do not add includeSubDomains
# without reviewing sibling hosts.
# add_header Strict-Transport-Security "max-age=31536000" always;
